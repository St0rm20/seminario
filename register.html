<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_blank" name="shell-type"/>
<title>Crea tu cuenta · ComParte</title>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<style>
@layer base{html,body{width:100vw;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:max(env(safe-area-inset-bottom,0px),8px);}.pt-safe{padding-top:max(env(safe-area-inset-top,0px),0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}
::-webkit-scrollbar{display:none;}
.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none;}
.no-scrollbar::-webkit-scrollbar{display:none;}
body{min-height:max(884px,100dvh);}
:focus-visible{outline:2px solid #006a36;outline-offset:2px;border-radius:4px;}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
@keyframes scale-up{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:none;}}
</style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen pt-safe pb-safe">
<div id="app-header"></div>
<main class="flex-1 flex flex-col relative w-full bg-surface pt-16">
  <div id="register-root" class="flex flex-col w-full px-margin pb-space-xl"></div>
</main>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/register.js"></script>
</body>
</html>
