<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_detail" name="shell-type"/>
<title>Detalle · ComParte</title>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<style>
@layer base{html,body{width:100vw;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:max(env(safe-area-inset-bottom,0px),8px);}.pt-safe{padding-top:max(env(safe-area-inset-top,0px),0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}
::-webkit-scrollbar{display:none;}
.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none;}
.no-scrollbar::-webkit-scrollbar{display:none;}
body{min-height:max(884px,100dvh);}
:focus-visible{outline:2px solid #006a36;outline-offset:2px;border-radius:4px;}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
@keyframes scale-up{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:none;}}
.line-clamp-2{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
.line-clamp-3{-webkit-line-clamp:3;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
</style>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen">
<div id="app-header"></div>
<main class="flex flex-col relative w-full pt-16 pb-32 bg-surface min-h-screen">
  <div id="detail-root" class="flex flex-col w-full"></div>
</main>
<div id="detail-bar" class="fixed bottom-0 inset-x-0 z-40 bg-surface/95 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.06)] pb-safe"></div>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/detalle.js"></script>
</body>
</html>
