<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_map" name="shell-type"/>
<title>Mapa · ComParte</title>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@layer base{html,body{width:100vw;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:max(env(safe-area-inset-bottom,0px),8px);}.pt-safe{padding-top:max(env(safe-area-inset-top,0px),0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}
::-webkit-scrollbar{display:none;}
.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none;}
.no-scrollbar::-webkit-scrollbar{display:none;}
body{min-height:max(884px,100dvh);}
:focus-visible{outline:2px solid #006a36;outline-offset:2px;border-radius:4px;}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
@keyframes scale-up{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:none;}}
.line-clamp-2{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
#cp-map{height:100%;width:100%;z-index:0;}
.leaflet-container{font-family:Inter,sans-serif;background:#eae8e3;}
.cp-pin{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0_2px_6px rgba(0,0,0,.28);}
.cp-pin>span{transform:rotate(45deg);font-size:18px;line-height:1;}
.cp-pin--active{background:#f58a3d;}
.cp-pin--active>span{color:#fff;}
.cp-pin--soldout{background:#9aa39b;}
.cp-pin--soldout>span{color:#fff;}
.cp-pin--mine{background:#006a36;}
.cp-pin--mine>span{color:#fff;}
.cp-marker{cursor:pointer;}
.cp-marker.is-selected{filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));transform:scale(1.12);}
.leaflet-popup-content-wrapper{border-radius:12px;padding:0;overflow:hidden;}
.leaflet-popup-content{margin:0;width:200px!important;}
.leaflet-popup-tip{background:#fff;}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M8KD2L8SP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-2M8KD2L8SP');
</script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen overflow-hidden">
<div id="app-header"></div>
<main class="relative w-full pt-16 pb-28 h-screen">
  <div id="cp-map" role="application" aria-label="Mapa de publicaciones disponibles"></div>
  <div id="map-overlay" class="absolute top-0 inset-x-0 z-[30] pointer-events-none"></div>
  <div id="map-fallback" class="absolute inset-0 z-[20] hidden bg-surface items-center justify-center"></div>
  <div id="map-sheet" class="absolute bottom-24 inset-x-0 z-[35]"></div>
</main>
<div id="app-nav"></div>
<script src="js/tailwind-config.js"></script>
<script src="js/store.js"></script>
<script src="js/zones.js"></script>
<script src="js/images.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/map.js"></script>
</body>
</html>
